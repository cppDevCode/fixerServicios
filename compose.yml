services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fixer_backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: pnpm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fixer_frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command pnpm run dev
